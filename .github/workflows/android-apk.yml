name: APK Android

# Compila la APK de release y la deja como artefacto descargable.
# Se puede lanzar a mano desde la pestaña Actions.
# El versionCode sale de BUILD_NUMBER y Android nunca instala encima una
# versión con número menor. Las APK del repositorio anterior llegaron a la 9,
# así que se suma 100 al contador de este workflow para quedar siempre por
# encima y que la actualización no exija desinstalar.
# Solo a mano. Compilar aquí son ~20 minutos porque cada ejecución arranca una
# máquina limpia y rehace los módulos nativos enteros; en el equipo del usuario,
# reutilizando la carpeta `android/`, son unos 6 (`npm run apk` en mobile/).
# Este workflow se queda para cuando haga falta una APK sin tener el equipo
# delante, o para comprobar que el proyecto compila desde cero.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Para publicar la Release con la APK.
    permissions:
      contents: write
    env:
      # Dirección que trae la APK de fábrica, para no tener que configurarla en
      # cada teléfono. Se cambia en Settings → Secrets and variables → Actions →
      # Variables, sin tocar el código. La pantalla «Servidor» sigue mandando
      # sobre esto en cada dispositivo.
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'http://localhost:4000' }}
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
        with:
          # write-build-info.mjs lista los últimos commits: con el clon
          # superficial por defecto solo vería uno.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      # Las expresiones de Actions no hacen aritmética: la suma va en el shell.
      - name: Número de compilación
        run: echo "BUILD_NUMBER=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Datos de la compilación
        run: node scripts/write-build-info.mjs ../notas-release.md

      - name: Generar proyecto nativo
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Renombrar APK
        run: mv android/app/build/outputs/apk/release/app-release.apk livora.apk

      - uses: actions/upload-artifact@v4
        with:
          name: livora-apk-${{ github.run_number }}
          path: mobile/livora.apk
          if-no-files-found: error

      # El asset se llama siempre igual, así que
      # https://github.com/keider21/livora/releases/latest/download/livora.apk
      # es un enlace fijo que siempre trae la última compilación.
      - name: Publicar la Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "build-$BUILD_NUMBER" mobile/livora.apk
          --title "Livora Stream - build $BUILD_NUMBER"
          --notes-file notas-release.md
