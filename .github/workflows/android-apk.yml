name: APK Android

# Compila la APK de release y la deja como artefacto descargable.
# Se puede lanzar a mano desde la pestaña Actions.
# El versionCode sale de BUILD_NUMBER y Android nunca instala encima una
# versión con número menor. Las APK del repositorio anterior llegaron a la 9,
# así que se suma 100 al contador de este workflow para quedar siempre por
# encima y que la actualización no exija desinstalar.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
        with:
          # write-build-info.mjs lista los últimos commits: con el clon
          # superficial por defecto solo vería uno.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      # Las expresiones de Actions no hacen aritmética: la suma va en el shell.
      - name: Número de compilación
        run: echo "BUILD_NUMBER=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Datos de la compilación
        run: node scripts/write-build-info.mjs

      - name: Generar proyecto nativo
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Renombrar APK
        run: mv android/app/build/outputs/apk/release/app-release.apk livora.apk

      - uses: actions/upload-artifact@v4
        with:
          name: livora-apk-${{ github.run_number }}
          path: mobile/livora.apk
          if-no-files-found: error
